[project]
name = "ioghal"
version = "0.2.0"
description = "IOGHAL — Pluggable local GPU Push-to-Talk voice runtime powered by VoxCPM2, Qwen (Ollama), and Whisper Large v3"
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "voxcpm",
    "torch>=2.10.0,<2.12.0",
    "torchaudio>=2.10.0,<2.12.0",
    "torchcodec>=0.10.0,<2.12.0",
    "transformers>=4.48.0",
    "huggingface-hub>=0.28.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "websockets>=14.0",
    "librosa>=0.10.2",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.1",
    "httpx>=0.27.0",
    "PyQt6>=6.7.0",
    "numpy>=1.26.0",
]

[project.scripts]
hal9000 = "hal9000.app:main"
hal9000-web = "hal9000.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hal9000"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
voxcpm = { path = "../VoxCPM", editable = true }
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchcodec = { index = "pytorch-cu130" }
